# Publica o APK no GitHub Release sempre que uma tag v1.0.N é enviada.
# O app consulta releases/latest e oferece a atualização sozinho.
name: Publicar APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      # Número da versão = último trecho da tag (v1.0.403 -> 403)
      - name: Extrair versão da tag
        id: versao
        run: |
          CODIGO="${GITHUB_REF_NAME##*.}"
          if ! [[ "$CODIGO" =~ ^[0-9]+$ ]]; then echo "Tag inválida: use v1.0.N"; exit 1; fi
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"

      # Arquivos que não ficam no repositório: vêm dos Secrets do GitHub
      - name: Restaurar google-services.json e chave de assinatura
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          echo "$DEBUG_KEYSTORE" | base64 -d > "$RUNNER_TEMP/fluxai.keystore"
          echo "FLUXAI_KEYSTORE=$RUNNER_TEMP/fluxai.keystore" >> "$GITHUB_ENV"
          touch local.properties

      - name: Compilar APK release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCodeCI=${{ steps.versao.outputs.codigo }}
          cp app/build/outputs/apk/release/app-release.apk FluxAi.apk

      # Trava de segurança: só publica se o APK estiver assinado com a chave original do app
      # (outra chave impede atualizar por cima e quebra o login do Google)
      - name: Conferir assinatura
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs FluxAi.apk | tee assinatura.txt
          grep -qi "SHA-256 digest: aeb666444a8be9c87806375bfd63bc5cb16f508bf2364fea0174431c16b42e97" assinatura.txt \
            || { echo "APK assinado com a chave errada: release cancelada."; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          name: FluxAí ${{ github.ref_name }}
          files: FluxAi.apk
          make_latest: true
