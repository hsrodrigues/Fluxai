# Publica o APK no GitHub Release sempre que uma tag v1.0.N é enviada.
# O app consulta releases/latest e oferece a atualização sozinho.
name: Publicar APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Número da versão = último trecho da tag (v1.0.403 -> 403)
      - name: Extrair versão da tag
        id: versao
        run: |
          CODIGO="${GITHUB_REF_NAME##*.}"
          if ! [[ "$CODIGO" =~ ^[0-9]+$ ]]; then echo "Tag inválida: use v1.0.N"; exit 1; fi
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"

      # Arquivos que não ficam no repositório: vêm dos Secrets do GitHub
      - name: Restaurar google-services.json e chave de assinatura
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
          touch local.properties

      - name: Compilar APK release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCodeCI=${{ steps.versao.outputs.codigo }}
          cp app/build/outputs/apk/release/app-release.apk FluxAi.apk

      - uses: softprops/action-gh-release@v2
        with:
          name: FluxAí ${{ github.ref_name }}
          files: FluxAi.apk
          make_latest: true
